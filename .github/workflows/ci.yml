name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Needs the vendored submodules: the parse step regenerates the committed data
  # from them, the drift check compares, and one unit test reads vendor/ directly.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci

      - name: Parse vendored data into generated JSON
        run: npm run parse

      - name: Check committed generated data matches submodule pin
        id: drift
        run: |
          # `git status`, not `git diff`: a generated file the branch forgot
          # to commit is untracked, which `git diff` never reports -- and
          # deploy.yml builds without parsing, so it would ship missing.
          drift=$(git status --porcelain --untracked-files=all -- src/data/generated public/textures)
          if [ -n "$drift" ]; then
            echo "$drift"
            git diff -- src/data/generated
            exit 1
          fi

      - name: Explain drift failure
        if: failure() && steps.drift.outcome == 'failure'
        run: |
          echo "::error::src/data/generated and/or public/textures are out of date with the pinned mcmeta submodules."
          echo "Run 'npm run parse' locally and commit every regenerated file, new (untracked) ones included."

      - name: Validate generated data
        run: npm run validate

      - name: Validate generated data
        run: npm run validate

      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: End-to-end smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Squash-merges a Dependabot PR once the jobs above pass, if the update is a
  # patch or minor: GitHub's documented pattern (dependabot/fetch-metadata, then
  # gh pr merge), pinned to the head that was checked. Majors and anything not
  # Dependabot's stay open for a person. A new PR job goes in needs: too, or
  # this merges before it finishes.
  automerge:
    name: 'Dependabot auto-merge'
    needs: [lint, typecheck, test, build, e2e]
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: 'Read the update type'
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: 'Merge minor and patch updates'
        id: merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
      # A merge made with GITHUB_TOKEN starts no workflows, so the push-to-main
      # push trigger of this workflow would not fire, and deploy.yml (workflow_run
      # on CI@main) would never run. workflow_dispatch is exempt, so dispatch CI
      # on main; its success starts the deploy.
      - name: 'Run CI on main to trigger deploy'
        if: steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref main
