version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github_actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Node's types track the runtime CI pins (`node-version` in the
      # workflows), not the newest Node -- bump both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Held at TypeScript 6: astro check refuses TypeScript 7.0; Astro's TypeScript 7 support needs
      # 7.1+ with @astrojs/ts-content-mapper. Remove this once that's supported.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
