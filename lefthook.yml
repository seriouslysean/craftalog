# Runs the checks CI runs before a push. `npm ci` enables it, through lefthook's own postinstall script (which skips when CI is set); `npx lefthook install` restores it.
# git exports repo-local variables such as GIT_DIR to a hook; from a linked worktree they point tools at the wrong repository.
pre-push:
  commands:
    ci:
      run: |
        unset $(git rev-parse --local-env-vars)
        set -e
        npm run vendor:init
        npm run parse
        test -z "$(git status --porcelain --untracked-files=all -- src/data/generated public/textures)"
        npm run validate
        npm run format:check
        npm run typecheck
        npm run lint
        npm test
        npm run build
        npm run test:e2e
